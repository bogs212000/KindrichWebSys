<script>
(()=>{
  const preferenceKey='kindrich_color_theme';
  const controls=[];
  const addToggle=(host,id)=>{
    if(!host||document.getElementById(id))return;
    const button=document.createElement('button');
    button.type='button';button.id=id;button.className='btn secondary theme-toggle';
    button.innerHTML='<span class="theme-toggle-icon" aria-hidden="true"></span><span class="theme-toggle-label"></span>';
    button.addEventListener('click',()=>apply(document.body.classList.contains('dark-mode')?'light':'dark'));
    host.insertBefore(button,host.querySelector('#export')||host.firstChild);
    controls.push(button);
  };
  const apply=mode=>{
    const dark=mode==='dark';
    document.body.classList.toggle('dark-mode',dark);
    localStorage.setItem(preferenceKey,dark?'dark':'light');
    controls.forEach(button=>{
      const label=dark?'Light mode':'Dark mode';
      button.querySelector('.theme-toggle-icon').textContent=dark?'☀':'☾';
      button.querySelector('.theme-toggle-label').textContent=label;
      button.title=label;button.setAttribute('aria-label',label);
    });
    if(typeof window.renderMonthlyExpenseCanvas==='function')window.renderMonthlyExpenseCanvas();
    if(typeof window.refreshKindrichCharts==='function')window.refreshKindrichCharts();
  };
  const toolbar=document.querySelector('.top .toolbar');
  const loginCard=document.querySelector('.login-card');
  addToggle(toolbar,'themeToggle');
  addToggle(loginCard,'loginThemeToggle');
  const saved=localStorage.getItem(preferenceKey);
  const dark=saved==='dark';
  document.body.classList.toggle('dark-mode',dark);
  controls.forEach(button=>{
    const label=dark?'Light mode':'Dark mode';
    button.querySelector('.theme-toggle-icon').textContent=dark?'☀':'☾';
    button.querySelector('.theme-toggle-label').textContent=label;
    button.title=label;button.setAttribute('aria-label',label);
  });
})();
</script>

(()=>{

        data:[{type:'spline',name:'Monthly Expenses',color:'#79a5ff',lineThickness:2,markerSize:0,showInLegend:false,dataPoints:cfg.monthlyData}]

      amount.classList.remove('kindrich-summary-amount-changed');void amount.offsetWidth;amount.classList.add('kindrich-summary-amount-changed');
    });
  }
  const baseRenderWithSummaryAnimation=render;
  render=function(){baseRenderWithSummaryAnimation();requestAnimationFrame(animateChangedSummaryAmounts)};
})();
</script>
<script>
(function(){
  const baseProjectOpenForm=openForm;
  openForm=function(type,id){
    baseProjectOpenForm(type,id);
    if(type!=='project')return;
    const fields=document.getElementById('fields'),tax=fields?.querySelector('[name="taxAmount"]'),budget=fields?.querySelector('[name="budget"]');
    if(!fields||!tax)return;
    const existing=id?(db.projects||[]).find(item=>item.id===id)||{}:{};
    const enabled=existing.taxIncluded===undefined?num(existing.taxAmount)>0:existing.taxIncluded===true;
    tax.removeAttribute('readonly');
    tax.value=enabled?moneyInputValue(existing.taxAmount||num(budget?.value)/1.12*.07):'';
    tax.closest('.group')?.insertAdjacentHTML('beforebegin',`<div class="group project-tax-toggle"><label><input type="checkbox" name="taxIncluded" ${enabled?'checked':''}> Tax Included</label><span class="sub">Tax = Project Budget / 1.12 × 7%</span></div>`);
    const checkbox=fields.querySelector('[name="taxIncluded"]');
    const syncTax=()=>{if(checkbox?.checked)tax.value=moneyInputValue(num(budget?.value)/1.12*.07);else tax.value=''};
    checkbox?.addEventListener('change',syncTax);
    budget?.addEventListener('input',()=>{if(checkbox?.checked)syncTax()});
    budget?.addEventListener('change',()=>{if(checkbox?.checked)syncTax()});
  };
  document.getElementById('form')?.addEventListener('submit',()=>{
    if(formType!=='project')return;
    setTimeout(()=>{
      const record=(db.projects||[]).find(item=>item.id===editing)||(db.projects||[]).at(-1),checkbox=document.querySelector('[name="taxIncluded"]'),tax=document.querySelector('[name="taxAmount"]');
      if(!record||!checkbox||!tax)return;
      record.taxIncluded=checkbox.checked;
      record.taxAmount=checkbox.checked?num(tax.value):'';
      save();
    },0);
  },true);
})();
</script>

<script>
(function(){
  const baseDashboardWithPresence=dashboard;
  const onlineInitials=name=>{const parts=String(name||'User').trim().split(/\s+/).filter(Boolean);return (parts.length>1?parts[0][0]+parts[parts.length-1][0]:String(name||'U').slice(0,2)).toUpperCase()};
  function paintDashboardPresence(){
    const host=document.querySelector('[data-dashboard-presence]');if(!host)return;
    const current=currentUser(),currentId=current?.id||'',list=(window.getFirebasePresenceUsers?.()||[]).filter(user=>user.id!==currentId),currentEntry={id:currentId,username:current?.username||'User'};
    const users=[currentEntry,...list.filter(user=>user.id!==currentId)],count=users.length;
    host.innerHTML=`<div class="dashboard-presence-head"><b>Online users</b><span>${count} online</span></div><div class="dashboard-online-list">${users.map(user=>`<span class="dashboard-online-user" title="${esc(user.username)}"><span class="dashboard-presence-avatar" aria-hidden="true">${esc(onlineInitials(user.username))}</span>${esc(user.username)}</span>`).join('')}</div>`;
  }
  window.renderDashboardPresence=paintDashboardPresence;
  dashboard=function(){
    baseDashboardWithPresence();
    const content=document.getElementById('content');
    if(!content)return;
    if(!content.querySelector('[data-dashboard-presence]'))content.insertAdjacentHTML('afterbegin','<div class="dashboard-presence" data-dashboard-presence></div>');
    paintDashboardPresence();
  };
})();
</script>
