  function bindConfirmationBulk(){let panels=[...document.querySelectorAll('#content .panel')],panel=panels[0],table=panel?.querySelector('table');if(!panel||!table)return;let pending=(db.deleteRequests||[]).filter(x=>x.status==='Pending'),bar=panel.querySelector('.toolbar');if(!bar)return;if(!document.getElementById('selectAllDeleteRequests'))bar.insertAdjacentHTML('beforeend','<button class="btn secondary" id="selectAllDeleteRequests">Select All</button><button class="btn danger" id="deleteSelectedRequests" hidden>Delete Selected</button>');if(!table.dataset.bulkBound){let head=table.tHead?.rows[0],body=table.tBodies[0];if(head)head.insertAdjacentHTML('afterbegin','<th>Select</th>');[...body?.rows||[]].forEach((row,i)=>{if(pending[i]&&!row.querySelector('.empty'))row.insertAdjacentHTML('afterbegin','<td><input type="checkbox" data-delete-request-select value="'+esc(pending[i].id)+'"></td>')});table.dataset.bulkBound='1'}let checks=()=>[...document.querySelectorAll('[data-delete-request-select]')],refresh=()=>{let selected=checks().filter(x=>x.checked).length,button=document.getElementById('deleteSelectedRequests');if(button){button.hidden=!selected;button.textContent='Delete Selected ('+selected+')'}};document.getElementById('selectAllDeleteRequests').onclick=()=>{let all=checks(),select=all.length&&!all.every(x=>x.checked);all.forEach(x=>x.checked=select);refresh()};document.getElementById('deleteSelectedRequests').onclick=()=>confirmBulkDeleteRequests(checks().filter(x=>x.checked).map(x=>x.value));checks().forEach(x=>x.onchange=refresh);refresh()}
  function bindPurchaseTools(){

    let addButton=document.getElementById('addRow'),expandButton=document.getElementById('expandTable'),bar=(addButton&&addButton.parentElement)||(expandButton&&expandButton.parentElement);

      bar.insertAdjacentHTML('afterbegin','<input class="field" id="purchaseSearch" placeholder="Search purchases" style="width:190px"><button class="btn secondary" id="runPurchaseSearch">Search</button><button class="btn secondary" id="clearPurchaseSearch">Clear</button><input id="purchaseImportFile" type="file" accept=".xlsx,.xls,.csv" hidden><button class="btn secondary" id="pickPurchaseImport">Upload Purchase Excel / CSV</button>');
      let filterPurchases=()=>{let query=document.getElementById('purchaseSearch').value.trim().toLowerCase(),filtered=linked('purchases',projectId).filter(x=>{if(!query)return true;let item=purchaseItem(x);return [item.description,x.description,x.purchaseNo,x.date,item.unit,x.unit].some(v=>String(v||'').toLowerCase().includes(query))});document.getElementById('records').innerHTML=recordTable(filtered);bindActions();bindPurchaseBulk(filtered)};
      document.getElementById('runPurchaseSearch').onclick=filterPurchases;
      document.getElementById('clearPurchaseSearch').onclick=()=>{document.getElementById('purchaseSearch').value='';filterPurchases()};
      document.getElementById('purchaseSearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();filterPurchases()}};
      document.getElementById('pickPurchaseImport').onclick=()=>document.getElementById('purchaseImportFile').click();
      document.getElementById('purchaseImportFile').onchange=e=>importPurchasesFile(e.target.files[0]);
    }
    if(tab==='purchases')bindPurchaseBulk(linked('purchases',projectId));
    if(tab==='expenses'&&!document.getElementById('expenseImportFile')){
      bar.insertAdjacentHTML('afterbegin','<input id="expenseImportFile" type="file" accept=".xlsx,.xls,.csv" hidden><button class="btn secondary" id="downloadExpenseFormat">Download Expense Format</button><button class="btn secondary" id="pickExpenseImport">Upload Expense Excel / CSV</button>');
      document.getElementById('downloadExpenseFormat').onclick=downloadExpenseTemplate;

  detail=function(){baseDetail();bindPurchaseTools();let p=project();if(p){let t=totals(p),budget=fallbackManpowerBudget(p,t),card=[...document.querySelectorAll('.detail-summary .card')].find(x=>x.querySelector('label')?.textContent==='Manpower Expenses');if(card){let note=card.querySelector('small');if(note)note.textContent=(budget-num(t.labor)>=0?'Remaining budget: ':'Over budget: ')+money(Math.abs(budget-num(t.labor)))}}};
  document.addEventListener('click',e=>{if(['runItemSearch','clearItemSearch'].includes(e.target.id))setTimeout(()=>bindItemBulk(linked('items',projectId).filter(itemMatchesSearch)),0)});

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyAB6PaLqj3sdB7fTdhdCpSrvwIP2HqcQfo",authDomain:"kindrich-8e2bd.firebaseapp.com",projectId:"kindrich-8e2bd",storageBucket:"kindrich-8e2bd.firebasestorage.app",messagingSenderId:"220553109199",appId:"1:220553109199:web:f3119d1fae7f79a31961ba",measurementId:"G-7MRQFJVPF6"};
const firebaseApp = initializeApp(firebaseConfig);
const firestore = getFirestore(firebaseApp);
const workspaceRef = doc(firestore, "workspaces", "main");
let applyingRemote = false;
let saveTimer;
function cleanWorkspace(workspace){
  const copy = JSON.parse(JSON.stringify(workspace || {}));
  delete copy.updatedAt;
  return copy;
}
function projectBundle(workspace, project){
  const projectId = project.id;
  return {
    ...project,
    items: (workspace.items || []).filter(x => x.project === projectId),
    purchases: (workspace.purchases || []).filter(x => x.project === projectId),
    manpower: (workspace.manpower || []).filter(x => x.project === projectId),
    manpowerApprovals: (workspace.manpowerApprovals || []).filter(x => x.project === projectId),
    expenses: (workspace.expenses || []).filter(x => x.project === projectId),
    canvassing: (workspace.canvassing || []).filter(x => x.project === projectId),
    forwarded: (workspace.forwarded || []).filter(x => x.project === projectId),
    vouchering: (workspace.vouchering || []).filter(x => x.project === projectId),
    payed: (workspace.payed || []).filter(x => x.project === projectId),
    totalsUpdatedAt: new Date().toISOString(),
    updatedAt: serverTimestamp()
  };
}
function saveProjectDocuments(workspace){
  const projects = Array.isArray(workspace?.projects) ? workspace.projects : [];
  return Promise.all(projects.filter(project => project.id).map(project => setDoc(doc(firestore, "projects", project.id), projectBundle(workspace, project), { merge: true })));
}
function saveUserDocuments(workspace){
  const roles = Array.isArray(workspace?.roles) ? workspace.roles : [];
  const users = Array.isArray(workspace?.users) ? workspace.users : [];
  return Promise.all(users.filter(user => user.id).map(user => {
    const role = roles.find(role => role.id === user.role) || {};
    return setDoc(doc(firestore, "users", user.id), {...user, roleName: role.name || '', roleAccess: { nav: role.nav || [], tabs: role.tabs || [] }, updatedAt: serverTimestamp()}, { merge: true });
  }));
}
function saveLogDocuments(workspace){
  const logs = Array.isArray(workspace?.logs) ? workspace.logs : [];
  return Promise.all(logs.filter(log => log.id).map(log => setDoc(doc(firestore, "logs", log.id), {...log, updatedAt: serverTimestamp()}, { merge: true })));
}
window.deleteProjectFromFirebase = projectId => deleteDoc(doc(firestore, "projects", projectId)).catch(err => console.warn("Project delete failed", err));
window.deleteUserFromFirebase = userId => deleteDoc(doc(firestore, "users", userId)).catch(err => console.warn("User delete failed", err));
window.saveWorkspaceToFirebase = workspace => {
  if (applyingRemote) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const clean = cleanWorkspace(workspace);
    Promise.all([
      setDoc(workspaceRef, {...clean, updatedAt: serverTimestamp()}),
      saveProjectDocuments(clean),
      saveUserDocuments(clean),
      saveLogDocuments(clean)
    ]).catch(err => console.warn("Workspace save failed", err));
  }, 350);
};
window.saveCategoryToFirebase = () => {
  if (window.getWorkspaceData) window.saveWorkspaceToFirebase(window.getWorkspaceData());
};
getDoc(workspaceRef).then(snap => {
  if (!snap.exists() && window.getWorkspaceData) {
    const clean = cleanWorkspace(window.getWorkspaceData()); return Promise.all([setDoc(workspaceRef, {...clean, updatedAt: serverTimestamp()}), saveProjectDocuments(clean), saveUserDocuments(clean), saveLogDocuments(clean)]);
  }
}).catch(err => console.warn("Workspace migration failed", err));
onSnapshot(workspaceRef, snap => {
  if (!snap.exists()) return;
  applyingRemote = true;
  if (window.applyFirebaseWorkspace) window.applyFirebaseWorkspace(cleanWorkspace(snap.data()));
  applyingRemote = false;
}, err => console.warn("Workspace sync failed", err));
isSupported().then(supported => { if (supported) getAnalytics(firebaseApp); });
</script>
