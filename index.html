<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-analytics.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyAB6PaLqj3sdB7fTdhdCpSrvwIP2HqcQfo",authDomain:"kindrich-8e2bd.firebaseapp.com",projectId:"kindrich-8e2bd",storageBucket:"kindrich-8e2bd.firebasestorage.app",messagingSenderId:"220553109199",appId:"1:220553109199:web:f3119d1fae7f79a31961ba",measurementId:"G-7MRQFJVPF6"};
const firebaseApp = initializeApp(firebaseConfig);
const firestore = getFirestore(firebaseApp);
const workspaceRef = doc(firestore, "workspaces", "main");
let applyingRemote = false;
let saveTimer;
function cleanWorkspace(workspace){
  const copy = JSON.parse(JSON.stringify(workspace || {}));
  delete copy.updatedAt;
  return copy;
}
function projectBundle(workspace, project){
  const projectId = project.id;
  return {
    ...project,
    items: (workspace.items || []).filter(x => x.project === projectId),
    purchases: (workspace.purchases || []).filter(x => x.project === projectId),
    manpower: (workspace.manpower || []).filter(x => x.project === projectId),
    manpowerApprovals: (workspace.manpowerApprovals || []).filter(x => x.project === projectId),
    expenses: (workspace.expenses || []).filter(x => x.project === projectId),
    canvassing: (workspace.canvassing || []).filter(x => x.project === projectId),
    vouchering: (workspace.vouchering || []).filter(x => x.project === projectId),
    totalsUpdatedAt: new Date().toISOString(),
    updatedAt: serverTimestamp()
  };
}
function saveProjectDocuments(workspace){
  const projects = Array.isArray(workspace?.projects) ? workspace.projects : [];
  return Promise.all(projects.filter(project => project.id).map(project => setDoc(doc(firestore, "projects", project.id), projectBundle(workspace, project), { merge: true })));
}
function saveUserDocuments(workspace){
  const roles = Array.isArray(workspace?.roles) ? workspace.roles : [];
  const users = Array.isArray(workspace?.users) ? workspace.users : [];
  return Promise.all(users.filter(user => user.id).map(user => {
    const role = roles.find(role => role.id === user.role) || {};
    return setDoc(doc(firestore, "users", user.id), {...user, roleName: role.name || '', roleAccess: { nav: role.nav || [], tabs: role.tabs || [] }, updatedAt: serverTimestamp()}, { merge: true });
  }));
}
function saveLogDocuments(workspace){
  const logs = Array.isArray(workspace?.logs) ? workspace.logs : [];
  return Promise.all(logs.filter(log => log.id).map(log => setDoc(doc(firestore, "logs", log.id), {...log, updatedAt: serverTimestamp()}, { merge: true })));
}
window.deleteProjectFromFirebase = projectId => deleteDoc(doc(firestore, "projects", projectId)).catch(err => console.warn("Project delete failed", err));
window.deleteUserFromFirebase = userId => deleteDoc(doc(firestore, "users", userId)).catch(err => console.warn("User delete failed", err));
window.saveWorkspaceToFirebase = workspace => {
  if (applyingRemote) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const clean = cleanWorkspace(workspace);
    Promise.all([
      setDoc(workspaceRef, {...clean, updatedAt: serverTimestamp()}),
      saveProjectDocuments(clean),
      saveUserDocuments(clean),
      saveLogDocuments(clean)
    ]).catch(err => console.warn("Workspace save failed", err));
  }, 350);
};
window.saveCategoryToFirebase = () => {
  if (window.getWorkspaceData) window.saveWorkspaceToFirebase(window.getWorkspaceData());
};
getDoc(workspaceRef).then(snap => {
  if (!snap.exists() && window.getWorkspaceData) {
    const clean = cleanWorkspace(window.getWorkspaceData()); return Promise.all([setDoc(workspaceRef, {...clean, updatedAt: serverTimestamp()}), saveProjectDocuments(clean), saveUserDocuments(clean), saveLogDocuments(clean)]);
  }
}).catch(err => console.warn("Workspace migration failed", err));
onSnapshot(workspaceRef, snap => {
  if (!snap.exists()) return;
  applyingRemote = true;
  if (window.applyFirebaseWorkspace) window.applyFirebaseWorkspace(cleanWorkspace(snap.data()));
  applyingRemote = false;
}, err => console.warn("Workspace sync failed", err));
isSupported().then(supported => { if (supported) getAnalytics(firebaseApp); });
</script>
